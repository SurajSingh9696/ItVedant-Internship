{% extends 'base.html' %}
{% block title %}Reset Password – HopeForward NGO{% endblock %}
{% block content %}
<section class="d-flex align-items-center justify-content-center py-5" style="min-height:80vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-lock-fill text-danger display-4 mb-2 d-block"></i>
                        <h3 class="fw-bold">Forgot Password</h3>
                        <p class="text-muted small">Enter your registered email address and we will send you a password reset link.</p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address</label>
                            {{ form.email }}
                        </div>
                        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">
                            <i class="bi bi-envelope me-2"></i>Send Reset Link
                        </button>
                    </form>
                    <hr>
                    <p class="text-center small text-muted mb-0">
                        Remember your password? <a href="{% url 'login' %}" class="text-danger text-decoration-none fw-semibold">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
