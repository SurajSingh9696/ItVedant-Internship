{% extends 'base.html' %}
{% block title %}Verify Email – HopeForward NGO{% endblock %}

{% block content %}
<section class="py-5" style="min-height: 70vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm p-5 text-center">
                    <i class="bi bi-envelope-check text-danger display-4 mb-3"></i>
                    <h3 class="fw-bold mb-3">Check Your Email</h3>
                    <p class="text-muted mb-4">We have sent a verification link to your email address. Please verify your account to continue.</p>
                    <a href="{% url 'login' %}" class="btn btn-outline-danger">Go to Login</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
