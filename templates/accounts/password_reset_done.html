{% extends 'base.html' %}
{% block title %}Password Reset Sent – HopeForward NGO{% endblock %}
{% block content %}
<section class="d-flex align-items-center justify-content-center py-5" style="min-height:80vh;">
    <div class="container text-center">
        <i class="bi bi-envelope-check-fill text-success display-1 mb-3 d-block"></i>
        <h3 class="fw-bold">Check Your Inbox</h3>
        <p class="text-muted mx-auto" style="max-width:400px;">We have sent a password reset link to your email address. Please check your inbox and follow the instructions.</p>
        <a href="{% url 'login' %}" class="btn btn-danger mt-3">Back to Login</a>
    </div>
</section>
{% endblock %}
