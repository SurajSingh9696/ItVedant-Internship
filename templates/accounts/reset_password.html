{% extends 'base.html' %}
{% block title %}Set New Password – HopeForward NGO{% endblock %}
{% block content %}
<section class="d-flex align-items-center justify-content-center py-5" style="min-height:80vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock-fill text-danger display-4 mb-2 d-block"></i>
                        <h3 class="fw-bold">Set New Password</h3>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">New Password</label>
                            {{ form.new_password1 }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Confirm New Password</label>
                            {{ form.new_password2 }}
                        </div>
                        {% if form.non_field_errors %}
                        <div class="alert alert-danger py-2 small">{{ form.non_field_errors.0 }}</div>
                        {% endif %}
                        <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
