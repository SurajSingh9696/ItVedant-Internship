{% extends 'base.html' %}
{% block title %}Password Reset Complete – HopeForward NGO{% endblock %}
{% block content %}
<section class="d-flex align-items-center justify-content-center py-5" style="min-height:80vh;">
    <div class="container text-center">
        <i class="bi bi-check-circle-fill text-success display-1 mb-3 d-block"></i>
        <h3 class="fw-bold">Password Updated!</h3>
        <p class="text-muted">Your password has been successfully changed. You can now sign in with your new password.</p>
        <a href="{% url 'login' %}" class="btn btn-danger mt-3">Sign In Now</a>
    </div>
</section>
{% endblock %}
