{% extends 'base.html' %}
{% block title %}Complete Payment – HopeForward NGO{% endblock %}

{% block content %}
<section class="py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm p-4 text-center">
                    <div class="mb-3">
                        <i class="bi bi-shield-check text-success" style="font-size: 2rem;"></i>
                    </div>
                    <h4 class="fw-bold mb-2">Complete Your Donation</h4>
                    <p class="text-muted mb-4">Amount: <strong>Rs. {{ donation.amount }}</strong></p>
                    <button id="pay-button" class="btn btn-danger btn-lg w-100">Pay Securely</button>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const options = {
    key: "{{ razorpay_key }}",
    amount: "{{ amount }}",
    currency: "INR",
    name: "HopeForward NGO",
    description: "Donation Payment",
    order_id: "{{ razorpay_order_id }}",
    handler: function (response) {
        fetch("{% url 'verify_payment' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                window.location.href = "/donate/success/" + data.pk + "/";
            } else {
                alert("Payment verification failed. Please contact support.");
            }
        });
    },
    theme: {
        color: "#dc3545"
    }
};

const rzp = new Razorpay(options);
document.getElementById("pay-button").onclick = function (e) {
    rzp.open();
    e.preventDefault();
};
</script>
{% endblock %}
